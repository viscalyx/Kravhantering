location = /api/ready {
    include /etc/nginx/snippets/readiness-probes.conf;
    deny all;
    error_page 403 =403 @readiness_forbidden;
    try_files /__kravhantering_readiness_probe__ @readiness_allowed;
}

location @readiness_allowed {
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    limit_req zone=readiness_per_client burst=5 nodelay;
    limit_req_status 429;
    error_page 405 =405 @readiness_method_not_allowed;
    error_page 429 = @readiness_rate_limited;

    proxy_pass http://app_runtime_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Kravhantering-Client-IP $remote_addr;
    proxy_set_header Connection "";
    add_header Cache-Control "no-store" always;
}

location @readiness_forbidden {
    add_header Cache-Control "no-store" always;
    return 204;
}

location @readiness_method_not_allowed {
    add_header Allow "GET, HEAD" always;
    add_header Cache-Control "no-store" always;
    return 204;
}

location @readiness_rate_limited {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "1" always;
    return 503 '{"status":"not_ready"}';
}
