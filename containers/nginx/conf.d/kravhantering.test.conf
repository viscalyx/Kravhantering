map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream app_runtime_upstream {
    server app-runtime:3000;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kravhantering.test;

    ssl_certificate /etc/nginx/tls/kravhantering.test.crt;
    ssl_certificate_key /etc/nginx/tls/kravhantering.test.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location = /auth {
        return 308 /auth/;
    }

    location = /auth/error {
        proxy_pass http://app-runtime:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Kravhantering-Client-IP $remote_addr;
    }

    location /auth/ {
        proxy_pass http://keycloak:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /api-docs/hsa-person-lookup {
        include /etc/nginx/snippets/api-docs-security-headers.conf;
        return 308 /api-docs/hsa-person-lookup/;
    }

    location /api-docs/ {
        include /etc/nginx/snippets/api-docs-security-headers.conf;
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    include /etc/nginx/snippets/readiness-locations.conf;

    location / {
        proxy_pass http://app-runtime:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Kravhantering-Client-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
