name: kravhantering-devcontainer

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      idp:
        # Don't block on healthy — Keycloak takes ~30s to start and would
        # slow every devcontainer attach. The app boots fine without it;
        # OIDC discovery happens lazily on first sign-in.
        condition: service_started
      kong:
        condition: service_healthy
    volumes:
      # Mount the root folder that contains .git
      - ..:/workspace:cached
      # Persistent npm cache for faster installs across rebuilds (commented out - not needed for infrequent rebuilds)
      # - npm-cache:/home/vscode/.npm

      # Persist SQLite state/logs within the default Codex HOME
      - type: volume
        source: codex-state
        target: /home/vscode/.codex/sqlite

      # Bind-mount only the subdirectories you want to persist on the host
      - type: bind
        source: ${HOME}/.codex/sessions
        target: /home/vscode/.codex/sessions
      - type: bind
        source: ${HOME}/.codex/plugins
        target: /home/vscode/.codex/plugins
      - type: bind
        source: ${HOME}/.codex/skills
        target: /home/vscode/.codex/skills
      - type: bind
        source: ${HOME}/.codex/rules
        target: /home/vscode/.codex/rules

      # Re-use auth file from host
      - type: bind
        source: ${HOME}/.codex/auth.json
        target: /home/vscode/.codex/auth.json

      # Keep runtime temp wrappers container-local
      - codex-tmp:/home/vscode/.codex/tmp
      - hsa-mtls-app:/run/kravhantering/hsa-mtls:ro
    # Keep container running
    command: sleep infinity
    env_file:
    - path: .env
      required: false
    environment:
      DATABASE_READONLY_PASSWORD_ENV: ${DATABASE_READONLY_PASSWORD_ENV:-DATABASE_READONLY_PASSWORD}
      DB_TRUST_SERVER_CERTIFICATE: ${DB_TRUST_SERVER_CERTIFICATE:-true}
      HSA_PERSON_LOOKUP_TIMEOUT_MS: ${HSA_PERSON_LOOKUP_TIMEOUT_MS:-5000}
      HSA_PERSON_LOOKUP_URL: ${HSA_PERSON_LOOKUP_URL:-https://kong:8443/hsa/person-records/lookup}
      HSA_PERSON_LOOKUP_CA_PATH: /run/kravhantering/hsa-mtls/kong-server-ca.crt
      HSA_PERSON_LOOKUP_CLIENT_CERT_PATH: /run/kravhantering/hsa-mtls/app-client.crt
      HSA_PERSON_LOOKUP_CLIENT_KEY_PATH: /run/kravhantering/hsa-mtls/app-client.key
      HSA_PERSON_LOOKUP_TLS_SERVER_NAME: kong
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_TELEMETRY_DISABLED: ${NEXT_TELEMETRY_DISABLED:-1}
      DOTNET_CLI_TELEMETRY_OPTOUT: ${DOTNET_CLI_TELEMETRY_OPTOUT:-1}
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: ${DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE:-true}
      DOTNET_SKIP_WORKLOAD_INTEGRITY_CHECK: ${DOTNET_SKIP_WORKLOAD_INTEGRITY_CHECK:-true}
    extra_hosts:
      # The release-smoke runner reaches nginx through Podman's published
      # 443 port on the devcontainer loopback address.
      - "kravhantering.test:127.0.0.1"
    devices:
      # Required by rootless Podman when it uses fuse-overlayfs for nested
      # local container storage (e.g. for the release-smoke container stack).
      - /dev/fuse:/dev/fuse
      # Required by slirp4netns for rootless Podman networking.
      - /dev/net/tun:/dev/net/tun
    # Ports are forwarded via devcontainer.json forwardPorts (VS Code handles this)
    # Proper init system for signal handling and zombie process reaping
    init: true

  db:
    image: mcr.microsoft.com/mssql/server:2025-CU8-ubuntu-24.04
    env_file:
    - path: .env
      required: false
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:-Y}
      MSSQL_PID: ${MSSQL_PID:-Developer}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Copy .devcontainer/.env.example to .devcontainer/.env and set MSSQL_SA_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 5s
      retries: 20
      start_period: 10s
      timeout: 5s
    ports:
      - "${SQLSERVER_HOST_PORT:-1433}:1433"
    volumes:
      - sqlserver-devcontainer-data:/var/opt/mssql

  idp:
    # Local OIDC IdP (Keycloak) for development. Mirrors
    # docker-compose.idp.yml so devcontainer users get auth-on by default
    # per the plan in docs/plan-auth.md. The realm `kravhantering-dev` is
    # imported on every start from `dev/keycloak/realm-kravhantering-dev.json`
    # — changes made via the admin UI on http://localhost:8080 are NOT
    # persisted across restarts.
    # See https://www.keycloak.org/docs/latest/upgrading/
    image: quay.io/keycloak/keycloak:26.7.3-0
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
    env_file:
    - path: .env
      required: false
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "${KEYCLOAK_HOST_PORT:-8080}:8080"
    volumes:
      - ../dev/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec '{ printf "GET /realms/kravhantering-dev/.well-known/openid-configuration HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3;
          grep -m 1 " 200 " <&3 >/dev/null; } 3<>/dev/tcp/localhost/8080 &&
          { printf "GET /realms/kravhantering-dev/protocol/openid-connect/certs HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3;
          grep -m 1 " 200 " <&3 >/dev/null; } 3<>/dev/tcp/localhost/8080'
      interval: 5s
      retries: 30
      start_period: 10s
      timeout: 5s

  hsa-mtls-provisioner:
    build:
      context: ${WORKSPACE_BUILD_ROOT:-..}
      dockerfile: containers/hsa-mtls-provisioner/Dockerfile
    command: ["activate", "--lifetime", "persistent"]
    user: "0:0"
    tmpfs:
      - /run/kravhantering/hsa-mtls-issuer:mode=0700
    volumes:
      - hsa-mtls-state:/var/lib/kravhantering/hsa-mtls
      - hsa-mtls-app:/run/kravhantering/hsa-mtls-runtime/app
      - hsa-mtls-kong:/run/kravhantering/hsa-mtls-runtime/kong
      - hsa-mtls-adapter:/run/kravhantering/hsa-mtls-runtime/adapter
      - hsa-mtls-mock:/run/kravhantering/hsa-mtls-runtime/mock

  kong:
    image: docker.io/kong/kong-gateway:3.15.0.5-20260824-ubuntu
    depends_on:
      hsa-person-lookup-adapter:
        condition: service_healthy
      hsa-mtls-provisioner:
        condition: service_completed_successfully
    environment:
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      KONG_CLIENT_SSL: "on"
      KONG_CLIENT_SSL_CERT: /run/kravhantering/hsa-mtls/kong-client.crt
      KONG_CLIENT_SSL_CERT_KEY: /run/kravhantering/hsa-mtls/kong-client.key
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.strict.yml
      KONG_NGINX_PROXY_INCLUDE: /kong/includes/strict-app-client-subject.conf
      KONG_NGINX_PROXY_PROXY_SSL_PROTOCOLS: TLSv1.2 TLSv1.3
      KONG_NGINX_PROXY_PROXY_SSL_TRUSTED_CERTIFICATE: /run/kravhantering/hsa-mtls/adapter-server-ca.crt
      KONG_NGINX_PROXY_SSL_CLIENT_CERTIFICATE: /run/kravhantering/hsa-mtls/app-client-ca.crt
      KONG_NGINX_PROXY_SSL_VERIFY_CLIENT: "on"
      KONG_NGINX_PROXY_SSL_VERIFY_DEPTH: "1"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: 0.0.0.0:8443 ssl
      KONG_SSL_CERT: /run/kravhantering/hsa-mtls/kong-server.crt
      KONG_SSL_CERT_KEY: /run/kravhantering/hsa-mtls/kong-server.key
      KONG_SSL_PROTOCOLS: TLSv1.2 TLSv1.3
      KONG_TLS_CERTIFICATE_VERIFY: "on"
    volumes:
      - ${WORKSPACE_HOST_ROOT:-..}/containers/kong/kong.strict.yml:/kong/declarative/kong.strict.yml:ro
      - ${WORKSPACE_HOST_ROOT:-..}/containers/kong/strict-app-client-subject.conf:/kong/includes/strict-app-client-subject.conf:ro
      - hsa-mtls-kong:/run/kravhantering/hsa-mtls:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      retries: 12
      start_period: 10s
      timeout: 5s

  hsa-person-lookup-adapter:
    build:
      context: ${WORKSPACE_BUILD_ROOT:-..}
      dockerfile: containers/hsa-person-lookup-adapter/Dockerfile
    depends_on:
      hsa-directory-mock:
        condition: service_healthy
      hsa-mtls-provisioner:
        condition: service_completed_successfully
    environment:
      HSA_ADAPTER_INGRESS_CA_PATH: /run/kravhantering/hsa-mtls/kong-client-ca.crt
      HSA_ADAPTER_INGRESS_CERT_PATH: /run/kravhantering/hsa-mtls/adapter-server.crt
      HSA_ADAPTER_INGRESS_EXPECTED_CLIENT_SUBJECT: CN=kravhantering-kong
      HSA_ADAPTER_INGRESS_KEY_PATH: /run/kravhantering/hsa-mtls/adapter-server.key
      HSA_SOAP_CA_PATH: /run/kravhantering/hsa-mtls/hsa-server-ca.crt
      HSA_SOAP_CLIENT_CERT_PATH: /run/kravhantering/hsa-mtls/adapter-client.crt
      HSA_SOAP_CLIENT_KEY_PATH: /run/kravhantering/hsa-mtls/adapter-client.key
      HSA_SOAP_ENDPOINT_URL: https://hsa-directory-mock:8443/svr-hsaws2/hsaws
      HSA_SOAP_TLS_SERVER_NAME: hsa-directory-mock
      HSA_SOAP_TIMEOUT_MS: 5000
    volumes:
      - hsa-mtls-adapter:/run/kravhantering/hsa-mtls:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "--input-type=module",
          "-e",
          "const response = await fetch('http://127.0.0.1:8081/health'); if (!response.ok) process.exit(1);"
        ]
      interval: 10s
      retries: 12
      start_period: 10s
      timeout: 5s

  hsa-directory-mock:
    build:
      context: ${WORKSPACE_BUILD_ROOT:-..}
      dockerfile: containers/hsa-directory-mock/Dockerfile
    depends_on:
      hsa-mtls-provisioner:
        condition: service_completed_successfully
    environment:
      HSA_MOCK_TLS_CA_PATH: /run/kravhantering/hsa-mtls/adapter-client-ca.crt
      HSA_MOCK_TLS_CERT_PATH: /run/kravhantering/hsa-mtls/mock-server.crt
      HSA_MOCK_TLS_EXPECTED_CLIENT_SERIAL_NUMBER: SE5560000000-MOCK001
      HSA_MOCK_TLS_KEY_PATH: /run/kravhantering/hsa-mtls/mock-server.key
    volumes:
      - hsa-mtls-mock:/run/kravhantering/hsa-mtls:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "--input-type=module",
          "-e",
          "const response = await fetch('http://127.0.0.1:8081/health'); if (!response.ok) process.exit(1);"
        ]
      interval: 10s
      retries: 12
      start_period: 10s
      timeout: 5s

volumes:
  sqlserver-devcontainer-data:
  codex-tmp:
  codex-state:
  hsa-mtls-state:
  hsa-mtls-app:
  hsa-mtls-kong:
  hsa-mtls-adapter:
  hsa-mtls-mock:
