# User-level Codex settings required by the Kravhantering devcontainer.
# The devcontainer postCreateCommand merges this into user configuration (~/.codex/config.toml).
# Then Codex automatically layers the project’s .codex/config.toml on top of it.

approval_policy = "never"
default_permissions = "kravhantering-development"

[projects."/workspace"]
trust_level = "trusted"

[permissions.kravhantering-development]
description = "Workspace access with kravhantering local development network."
extends = ":workspace"

[permissions.kravhantering-development.filesystem]
"~/.codex/skills" = "write"

[permissions.kravhantering-development.filesystem.":workspace_roots"]
".codex" = "write"
".git" = "write"

[permissions.kravhantering-development.network]
enabled = true
allow_local_binding = true

[permissions.kravhantering-development.network.domains]
"db" = "allow"
"idp" = "allow"
"kong" = "allow"
"hsa-directory-mock" = "allow"
"hsa-person-lookup-adapter" = "allow"
"localhost" = "allow"
"127.0.0.1" = "allow"
"::1" = "allow"

[plugins.openai-templates]
enabled = false

[plugins.plugin-management]
enabled = false

[[skills.config]]
name = "plugin-creator"
enabled = false

