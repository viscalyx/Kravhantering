name: Container PR Smoke
on:
  pull_request: null
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  core-candidate:
    name: Candidate Build and Vulnerability Policy (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: app-runtime
            label: app-runtime
            dockerfile: containers/app/Dockerfile
            target: app-runtime
          - candidate: db-job
            label: db-job
            dockerfile: containers/app/Dockerfile
            target: db-job
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install repository npm
        run: node scripts/install-repository-npm.mjs
      - name: Restore npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate candidate and vulnerability contracts
        run: npm run test -- scripts/__tests__/container-vulnerability-policy.test.mjs tests/unit/container-image-contract.test.ts
      - name: Build and evaluate candidate
        id: candidate
        uses: ./.github/actions/container-candidate
        with:
          candidate: ${{ matrix.candidate }}
          dockerfile: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
      - name: Upload candidate and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-candidate-${{ matrix.candidate }}
          path: tmp/container-candidate/
          retention-days: 2
  support-candidate:
    name: Candidate Build and Vulnerability Policy (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: demo-seed
            label: demo-seed
            dockerfile: containers/app/Dockerfile
            target: demo-seed
          - candidate: hsa-directory-mock
            label: HSA directory mock
            dockerfile: containers/hsa-directory-mock/Dockerfile
            target: ""
          - candidate: hsa-person-lookup-adapter
            label: HSA person lookup adapter
            dockerfile: containers/hsa-person-lookup-adapter/Dockerfile
            target: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install repository npm
        run: node scripts/install-repository-npm.mjs
      - name: Restore npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate candidate and vulnerability contracts
        run: npm run test -- scripts/__tests__/container-vulnerability-policy.test.mjs tests/unit/container-image-contract.test.ts
      - name: Build and evaluate candidate
        id: candidate
        uses: ./.github/actions/container-candidate
        with:
          candidate: ${{ matrix.candidate }}
          dockerfile: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
      - name: Upload candidate and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-candidate-${{ matrix.candidate }}
          path: tmp/container-candidate/
          retention-days: 2
  production-assembly:
    name: Production Assembly Acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    env:
      APP_RUNTIME_IMAGE: localhost/kravhantering/app-runtime
      APP_RUNTIME_OCI_ARCHIVE: tmp/candidates/app-runtime/app-runtime.oci.tar
      DB_JOB_IMAGE: localhost/kravhantering/db-job
      DB_JOB_OCI_ARCHIVE: tmp/candidates/db-job/db-job.oci.tar
      KEYCLOAK_IMAGE_REF: quay.io/keycloak/keycloak:26.7.3-0
      NEXT_PUBLIC_SITE_URL: https://kravhantering.test
      NGINX_IMAGE_REF: docker.io/library/nginx:1.31.5-alpine
      SQLSERVER_IMAGE_REF: mcr.microsoft.com/mssql/server:2025-CU8-ubuntu-24.04
      CI_RUNTIME_EVIDENCE_DIR: tmp/container-pr-artifacts/runtime-diagnostics
      CI_RUNTIME_RELATED_EVIDENCE_DIR: tmp/production-smoke-evidence
      PRODUCTION_SMOKE_SCOPE: core
    steps:
      - name: Record assembly start
        run: echo "ASSEMBLY_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install repository npm
        run: node scripts/install-repository-npm.mjs
      - name: Restore npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate production archive and runtime contracts
        run: npm run test -- scripts/__tests__/production-smoke-startup.test.mjs scripts/__tests__/prepare-production-smoke-bundle.test.mjs scripts/__tests__/container-release.test.mjs scripts/__tests__/ci-container-runtime.test.mjs
      - name: Download app-runtime candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: container-candidate-app-runtime
          path: tmp/candidates/app-runtime
      - name: Download db-job candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: container-candidate-db-job
          path: tmp/candidates/db-job
      - name: Restore exact candidate build metadata
        run: |
          cat tmp/candidates/app-runtime/build.env >> "$GITHUB_ENV"
          cp tmp/candidates/app-runtime/build.json public/build.json
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Install container runtime tools
        run: |
          set -euo pipefail
          scripts/containers/ci-container-runtime.sh bootstrap pr
          touch "${RUNNER_TEMP}/kravhantering-ci-runtime-ready"
          sudo sysctl net.ipv4.ip_unprivileged_port_start=0
          echo "127.0.0.1 kravhantering.test" | sudo tee -a /etc/hosts
          timeout --kill-after=5s 30s podman info
          docker --version
          docker buildx version
          docker info
          docker buildx ls
      - name: Restore repository npm after container runtime setup
        run: node scripts/install-repository-npm.mjs
      - name: Preflight rootless Podman journald logging
        run: scripts/containers/ci-container-runtime.sh preflight
      - name: Create per-container local env files
        run: npm run container:env:local
      - name: Generate production-smoke TLS
        run: node scripts/containers/generate-tls.mjs --output-dir tmp/container-tls
      - name: Prepare exact PR stack lock
        run: |
          set -euo pipefail

          app_image_id="$(jq -er '."containerimage.config.digest"' tmp/candidates/app-runtime/app-runtime-buildx.json)"
          app_manifest_digest="$(jq -er '."containerimage.digest"' tmp/candidates/app-runtime/app-runtime-buildx.json)"
          db_job_image_id="$(jq -er '."containerimage.config.digest"' tmp/candidates/db-job/db-job-buildx.json)"
          db_job_manifest_digest="$(jq -er '."containerimage.digest"' tmp/candidates/db-job/db-job-buildx.json)"
          node scripts/containers/generate-stack-lock.mjs generate \
            --app-image "${APP_RUNTIME_IMAGE}" \
            --app-tag "${APP_RUNTIME_TAG}" \
            --app-manifest-digest "${app_manifest_digest}" \
            --app-image-id "${app_image_id}" \
            --app-source pr-build \
            --db-job-image "${DB_JOB_IMAGE}" \
            --db-job-tag "${DB_JOB_TAG}" \
            --db-job-manifest-digest "${db_job_manifest_digest}" \
            --db-job-image-id "${db_job_image_id}" \
            --db-job-source pr-build
          node scripts/containers/generate-stack-lock.mjs check

          {
            echo "APP_RUNTIME_MANIFEST_DIGEST=${app_manifest_digest}"
            echo "DB_JOB_MANIFEST_DIGEST=${db_job_manifest_digest}"
            echo "APP_RUNTIME_IMAGE_ID=${app_image_id}"
            echo "DB_JOB_IMAGE_ID=${db_job_image_id}"
          } >> "${GITHUB_ENV}"
      - name: Build production deployment archive for PR
        run: |
          node scripts/containers/prepare-production-smoke-bundle.mjs \
            --version "${BUILD_VERSION}" \
            --commit-sha "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --app-ref "${APP_RUNTIME_IMAGE_REF}" \
            --app-image-id "${APP_RUNTIME_IMAGE_ID}" \
            --app-manifest-digest "${APP_RUNTIME_MANIFEST_DIGEST}" \
            --db-job-ref "${DB_JOB_IMAGE_REF}" \
            --db-job-image-id "${DB_JOB_IMAGE_ID}" \
            --db-job-manifest-digest "${DB_JOB_MANIFEST_DIGEST}" \
            --stack-lock container-stack.lock.json \
            --output-dir tmp/container-pr-artifacts/deployment
      - name: Install production archive with rootless Quadlet
        run: |
          scripts/containers/production-smoke.sh up --archive \
            "tmp/container-pr-artifacts/kravhantering-production-deploy-${BUILD_VERSION}.tar.gz"
      - name: Verify production stack
        run: scripts/containers/production-smoke.sh verify
      - name: Collect production Quadlet evidence
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: timeout --kill-after=10s 120s scripts/containers/production-smoke.sh evidence
      - name: Collect container runtime diagnostics
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 2
        run: scripts/containers/ci-container-runtime.sh collect
      - name: Remove production Quadlet stack
        if: always()
        timeout-minutes: 3
        run: timeout --kill-after=10s 120s scripts/containers/production-smoke.sh down
      - name: Upload assembly evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-assembly-evidence
          path: |
            tmp/production-smoke-evidence/
            tmp/container-pr-artifacts/runtime-diagnostics/
            tmp/container-pr-artifacts/deployment/DEPLOYMENT-MANIFEST.json
            container-stack.lock.json
            public/build.json
            playwright-report-release-smoke/
            test-results/release-smoke/
          retention-days: 7
      - name: Summarize assembly runtime
        if: always()
        env:
          ASSEMBLY_RESULT: ${{ job.status }}
        run: |
          {
            echo "### Production Assembly Acceptance"
            echo "Outcome: ${ASSEMBLY_RESULT}"
            echo "Runtime: $(( $(date +%s) - ASSEMBLY_STARTED_AT )) seconds"
            echo "Evidence: production-assembly-evidence"
          } >> "$GITHUB_STEP_SUMMARY"
    needs:
      - core-candidate
  runner-metadata:
    name: Capture Container Smoke Runner Metadata
    needs: production-assembly
    if: ${{ always() && needs.production-assembly.result != 'skipped' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/reusable-container-runner-metadata.yml
    with:
      artifact-name: container-pr-runner-metadata-${{ github.run_id }}
      evidence-directory: tmp/container-pr-runner-metadata
      retention-days: 7
      target-job: Production Assembly Acceptance

  hsa-build:
    name: Build current-commit OCI candidates
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    timeout-minutes: 30
    steps:
      - name: Check out current commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Prepare Docker Buildx builder
        run: |
          set -euo pipefail
          docker buildx create --name kravhantering-hsa-topology-builder --use ||
            docker buildx use kravhantering-hsa-topology-builder
          docker buildx inspect --bootstrap
      - name: Build shared OCI candidates
        run: |
          set -euo pipefail
          mkdir -p /tmp/hsa-oci
          docker buildx build --provenance=false \
            --tag localhost/kravhantering/hsa-transport-contract-test:topology \
            --output type=docker,dest=/tmp/hsa-oci/transport-test.tar \
            --file containers/hsa-mtls-topology/Dockerfile .
          docker buildx build --provenance=false \
            --tag localhost/kravhantering/hsa-mtls-provisioner:topology \
            --output type=docker,dest=/tmp/hsa-oci/provisioner.tar \
            --file containers/hsa-mtls-provisioner/Dockerfile .
      - name: Upload exact OCI candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hsa-mtls-current-commit-oci
          path: /tmp/hsa-oci
          retention-days: 1

  hsa-topology:
    name: Authenticated topology and isolation
    needs: [hsa-build, support-candidate]
    if: ${{ !cancelled() && needs.hsa-build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    timeout-minutes: 30
    steps:
      - name: Check out current commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Download exact OCI candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: hsa-mtls-current-commit-oci
          path: /tmp/hsa-oci
      - name: Download HSA mock candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: container-candidate-hsa-directory-mock
          path: /tmp/hsa-oci/candidates/hsa-directory-mock
      - name: Download HSA adapter candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: container-candidate-hsa-person-lookup-adapter
          path: /tmp/hsa-oci/candidates/hsa-person-lookup-adapter
      - name: Convert shared OCI candidates for Docker
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes skopeo
          for candidate in hsa-directory-mock hsa-person-lookup-adapter; do
            skopeo copy \
              "oci-archive:/tmp/hsa-oci/candidates/${candidate}/${candidate}.oci.tar" \
              "docker-archive:/tmp/hsa-oci/${candidate}.tar:localhost/kravhantering/${candidate}:topology"
          done
      - name: Load exact OCI candidates
        run: |
          set -euo pipefail
          for archive in /tmp/hsa-oci/*.tar; do docker load --input "$archive"; done
          for candidate in hsa-directory-mock hsa-person-lookup-adapter; do
            expected="$(jq -er '."containerimage.config.digest"' "/tmp/hsa-oci/candidates/${candidate}/${candidate}-buildx.json")"
            actual="$(docker image inspect --format '{{.Id}}' "localhost/kravhantering/${candidate}:topology")"
            test "$actual" = "$expected"
          done
      - name: Start loaded candidates and verify strict topology
        run: |
          set -euo pipefail
          compose=(docker compose -f containers/hsa-mtls-topology/compose.yml)
          "${compose[@]}" up --no-build provisioner
          "${compose[@]}" up --no-build -d --wait mock adapter kong
          "${compose[@]}" run --rm --no-deps test | tee /tmp/hsa-topology.log
      - name: Verify correlation continuity and exactly-once terminal handling
        run: |
          set -euo pipefail
          correlation="$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}' /tmp/hsa-topology.log | tail -1)"
          test -n "$correlation"
          docker compose -f containers/hsa-mtls-topology/compose.yml logs --no-color kong adapter mock > /tmp/hsa-runtime.log
          test "$(grep -Ec "hsa_app_lookup_started.*$correlation|$correlation.*hsa_app_lookup_started" /tmp/hsa-topology.log)" -eq 1
          test "$(grep -ac "kong.*$correlation" /tmp/hsa-runtime.log)" -eq 1
          test "$(grep -aEc "adapter.*(hsa_adapter_lookup_forwarded.*$correlation|$correlation.*hsa_adapter_lookup_forwarded)" /tmp/hsa-runtime.log)" -eq 1
          test "$(grep -aEc "mock.*(hsa_mock_lookup_handled.*$correlation|$correlation.*hsa_mock_lookup_handled)" /tmp/hsa-runtime.log)" -eq 1
          grep -a "mock.*$correlation" /tmp/hsa-runtime.log | grep '"handling_count":1'
      - name: Inspect runtime isolation
        run: |
          set -euo pipefail
          docker compose -f containers/hsa-mtls-topology/compose.yml config > /tmp/hsa-compose.txt
          if grep -E '(:rw|ca-signing|HSA_MOCK_AUTH_MODE|NODE_TLS_REJECT_UNAUTHORIZED)' /tmp/hsa-compose.txt; then
            exit 1
          fi
          containers/hsa-mtls-topology/runtime-inspection.sh
          docker compose -f containers/hsa-mtls-topology/compose.yml run --rm provisioner inspect
      - name: Reject foreign material in every runtime leaf role
        run: containers/hsa-mtls-topology/runtime-substitution-test.sh
      - name: Reject same-domain wrong servers through deployed clients
        run: containers/hsa-mtls-topology/runtime-wrong-server-test.sh
      - name: Remove ephemeral PKI material
        if: always()
        run: docker compose -f containers/hsa-mtls-topology/compose.yml down --volumes --remove-orphans

  hsa-rotation:
    name: Rotation and rollback (${{ matrix.trust-domain }})
    needs: [hsa-build, support-candidate]
    if: ${{ !cancelled() && needs.hsa-build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        trust-domain: [app-to-kong, kong-to-adapter, adapter-to-hsa]
    steps:
      - name: Check out current commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Download exact OCI candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: hsa-mtls-current-commit-oci
          path: /tmp/hsa-oci
      - name: Download HSA mock candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: container-candidate-hsa-directory-mock
          path: /tmp/hsa-oci/candidates/hsa-directory-mock
      - name: Download HSA adapter candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: container-candidate-hsa-person-lookup-adapter
          path: /tmp/hsa-oci/candidates/hsa-person-lookup-adapter
      - name: Convert shared OCI candidates for Docker
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes skopeo
          for candidate in hsa-directory-mock hsa-person-lookup-adapter; do
            skopeo copy \
              "oci-archive:/tmp/hsa-oci/candidates/${candidate}/${candidate}.oci.tar" \
              "docker-archive:/tmp/hsa-oci/${candidate}.tar:localhost/kravhantering/${candidate}:topology"
          done
      - name: Load exact OCI candidates
        run: |
          set -euo pipefail
          for archive in /tmp/hsa-oci/*.tar; do docker load --input "$archive"; done
          for candidate in hsa-directory-mock hsa-person-lookup-adapter; do
            expected="$(jq -er '."containerimage.config.digest"' "/tmp/hsa-oci/candidates/${candidate}/${candidate}-buildx.json")"
            actual="$(docker image inspect --format '{{.Id}}' "localhost/kravhantering/${candidate}:topology")"
            test "$actual" = "$expected"
          done
      - name: Start and verify current generation
        run: |
          set -euo pipefail
          compose=(docker compose -f containers/hsa-mtls-topology/compose.yml)
          "${compose[@]}" up --no-build provisioner
          "${compose[@]}" up --no-build -d --wait mock adapter kong
          "${compose[@]}" run --rm --no-deps test
      - name: Rotate, authenticate, and finalize successful generation
        env:
          HSA_MTLS_LIFETIME: ephemeral
        run: containers/hsa-mtls-topology/lifecycle.sh rotate '${{ matrix.trust-domain }}'
      - name: Inject failure, roll back, and authenticate prior generation
        env:
          HSA_MTLS_LIFETIME: ephemeral
        run: containers/hsa-mtls-topology/lifecycle.sh rollback-verification '${{ matrix.trust-domain }}'
      - name: Remove ephemeral PKI material
        if: always()
        run: docker compose -f containers/hsa-mtls-topology/compose.yml down --volumes --remove-orphans

  hsa-required:
    name: HSA mTLS topology required
    if: always()
    needs: [hsa-build, hsa-topology, hsa-rotation]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Report stable required result
        env:
          ROTATION_RESULT: ${{ needs.hsa-rotation.result }}
          TOPOLOGY_RESULT: ${{ needs.hsa-topology.result }}
          BUILD_RESULT: ${{ needs.hsa-build.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$TOPOLOGY_RESULT" = success
          test "$ROTATION_RESULT" = success
