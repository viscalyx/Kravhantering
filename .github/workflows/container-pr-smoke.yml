name: Container PR Smoke

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  container-smoke:
    name: Build and Smoke Test Container Stack
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read

    env:
      APP_RUNTIME_IMAGE: localhost/kravhantering/app-runtime
      APP_RUNTIME_OCI_ARCHIVE: tmp/container-pr-artifacts/oci/app-runtime.oci.tar
      DB_JOB_IMAGE: localhost/kravhantering/db-job
      DB_JOB_OCI_ARCHIVE: tmp/container-pr-artifacts/oci/db-job.oci.tar
      DEMO_SEED_IMAGE: localhost/kravhantering/demo-seed
      DEMO_SEED_OCI_ARCHIVE: tmp/container-pr-artifacts/oci/demo-seed.oci.tar
      HSA_DIRECTORY_MOCK_IMAGE: localhost/kravhantering/hsa-directory-mock
      HSA_DIRECTORY_MOCK_OCI_ARCHIVE: tmp/container-pr-artifacts/oci/hsa-directory-mock.oci.tar
      HSA_PERSON_LOOKUP_ADAPTER_IMAGE: localhost/kravhantering/hsa-person-lookup-adapter
      HSA_PERSON_LOOKUP_ADAPTER_OCI_ARCHIVE: tmp/container-pr-artifacts/oci/hsa-person-lookup-adapter.oci.tar
      KEYCLOAK_IMAGE_REF: quay.io/keycloak/keycloak:26.7.0-1
      KONG_IMAGE_REF: docker.io/kong/kong-gateway:3.15.0.2-20260721-ubuntu
      NEXT_PUBLIC_SITE_URL: https://kravhantering.test
      NGINX_IMAGE_REF: docker.io/library/nginx:1.31.3-alpine
      SQLSERVER_IMAGE_REF: mcr.microsoft.com/mssql/server:2025-CU7-ubuntu-24.04
      CI_RUNTIME_EVIDENCE_DIR: tmp/container-pr-artifacts/runtime-diagnostics
      CI_RUNTIME_RELATED_EVIDENCE_DIR: tmp/production-smoke-evidence

    steps:
      - name: Report initial disk layout
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/report-disk-layout.sh" <<'REPORT_DISK_LAYOUT'
          #!/usr/bin/env bash
          set -euo pipefail

          label="${1:-disk layout}"
          verify_root="/tmp/kh-oci-${CONTAINER_STACK_RUN_ID:-${GITHUB_RUN_ID}}"
          mkdir -p "${verify_root}" "${GITHUB_WORKSPACE}/tmp/container-pr-artifacts/oci"

          echo "::group::${label}: mounted filesystems"
          df -hT
          df -ihT
          echo "::endgroup::"

          echo "::group::${label}: target mounts"
          for target in \
            "${GITHUB_WORKSPACE}" \
            "${RUNNER_TEMP:-/tmp}" \
            / \
            /tmp \
            /var/tmp \
            "${GITHUB_WORKSPACE}/tmp/container-pr-artifacts/oci" \
            "${verify_root}"; do
            printf '\nTarget: %s\n' "${target}"
            df -hT "${target}"
            df -ihT "${target}"
            findmnt -T "${target}" || true
          done
          echo "::endgroup::"

          echo "::group::${label}: container storage usage"
          if command -v docker >/dev/null 2>&1; then
            docker system df || true
          else
            echo "docker not available"
          fi
          if [[ -f "${RUNNER_TEMP}/kravhantering-ci-runtime-ready" ]] && \
            command -v podman >/dev/null 2>&1; then
            podman system df || true
          else
            echo "podman storage report deferred until runtime bootstrap"
          fi
          du -sh \
            "${GITHUB_WORKSPACE}/tmp/container-pr-artifacts/oci" \
            "${verify_root}" \
            /tmp \
            /var/tmp \
            /var/lib/docker \
            "${HOME}/.local/share/containers" 2>/dev/null || true
          echo "::endgroup::"
          REPORT_DISK_LAYOUT

          chmod +x "${RUNNER_TEMP}/report-disk-layout.sh"
          "${RUNNER_TEMP}/report-disk-layout.sh" "initial"

      - name: Remove unused pre-installed runner toolchains
        run: |
          set -euo pipefail

          unused_toolchains=(
            /home/linuxbrew
            /usr/local/lib/android
            /usr/local/.ghcup
            /usr/local/share/vcpkg
            /opt/ghc
            /opt/hostedtoolcache/CodeQL
            /opt/hostedtoolcache/go
            /opt/hostedtoolcache/ghc
            /opt/hostedtoolcache/PyPy
            /opt/hostedtoolcache/Python
            /opt/hostedtoolcache/Ruby
            /usr/share/dotnet
            /usr/share/miniconda
            /usr/share/swift
          )

          for toolchain in "${unused_toolchains[@]}"; do
            if sudo test -e "${toolchain}"; then
              sudo du -sh "${toolchain}" || true
              sudo rm -rf -- "${toolchain}"
            fi
          done

          sudo apt-get clean
          docker image prune --all --force
          "${RUNNER_TEMP}/report-disk-layout.sh" "after runner toolchain cleanup"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install repository npm
        run: node scripts/install-repository-npm.mjs

      - name: Restore npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install container runtime tools
        run: |
          set -euo pipefail
          scripts/containers/ci-container-runtime.sh bootstrap pr
          touch "${RUNNER_TEMP}/kravhantering-ci-runtime-ready"
          sudo sysctl net.ipv4.ip_unprivileged_port_start=0
          echo "127.0.0.1 kravhantering.test" | sudo tee -a /etc/hosts
          timeout --kill-after=5s 30s podman info
          docker --version
          docker buildx version
          docker info
          docker buildx ls

      - name: Preflight rootless Podman journald logging
        run: scripts/containers/ci-container-runtime.sh preflight

      - name: Prepare Docker Buildx builder
        run: |
          set -euo pipefail
          docker buildx create --name kravhantering-pr-builder --use ||
            docker buildx use kravhantering-pr-builder
          docker buildx inspect --bootstrap

      - name: Prepare candidate artifact directories
        run: mkdir -p tmp/container-pr-artifacts/oci

      - name: Compute PR image metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"
          image_tag="pr-${PR_NUMBER}-${GITHUB_RUN_ID}-${short_sha}"
          package_version="$(node -p "require('./package.json').version")"
          build_time="$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")"

          {
            echo "APP_RUNTIME_SOURCE=pr-build"
            echo "APP_RUNTIME_TAG=${image_tag}"
            echo "APP_RUNTIME_IMAGE_REF=${APP_RUNTIME_IMAGE}:${image_tag}"
            echo "BUILD_COMMIT_SHA=${GITHUB_SHA}"
            echo "BUILD_IMAGE_TAG=${APP_RUNTIME_IMAGE}:${image_tag}"
            echo "BUILD_TIME=${build_time}"
            echo "BUILD_VERSION=${package_version}-pr.${PR_NUMBER}.${GITHUB_RUN_ID}"
            echo "CONTAINER_STACK_RUN_ID=${GITHUB_RUN_ID}"
            echo "DB_JOB_SOURCE=pr-build"
            echo "DB_JOB_TAG=${image_tag}"
            echo "DB_JOB_IMAGE_REF=${DB_JOB_IMAGE}:${image_tag}"
            echo "DEMO_SEED_SOURCE=pr-build"
            echo "DEMO_SEED_TAG=${image_tag}"
            echo "DEMO_SEED_IMAGE_REF=${DEMO_SEED_IMAGE}:${image_tag}"
            echo "HSA_DIRECTORY_MOCK_SOURCE=pr-build"
            echo "HSA_DIRECTORY_MOCK_TAG=${image_tag}"
            echo "HSA_DIRECTORY_MOCK_IMAGE_REF=${HSA_DIRECTORY_MOCK_IMAGE}:${image_tag}"
            echo "HSA_PERSON_LOOKUP_ADAPTER_SOURCE=pr-build"
            echo "HSA_PERSON_LOOKUP_ADAPTER_TAG=${image_tag}"
            echo "HSA_PERSON_LOOKUP_ADAPTER_IMAGE_REF=${HSA_PERSON_LOOKUP_ADAPTER_IMAGE}:${image_tag}"
            echo "RELEASE_SMOKE_RUN_ID=${GITHUB_RUN_ID}"
          } >> "${GITHUB_ENV}"

      - name: Write host build metadata artifact
        run: node scripts/prebuild.js

      - name: Build app-runtime candidate OCI artifact
        run: |
          set -euo pipefail
          docker buildx build \
            --file containers/app/Dockerfile \
            --target app-runtime \
            --platform linux/amd64 \
            --metadata-file tmp/container-pr-artifacts/oci/app-runtime-buildx.json \
            --tag "${APP_RUNTIME_IMAGE}:${APP_RUNTIME_TAG}" \
            --build-arg BUILD_VERSION="${BUILD_VERSION}" \
            --build-arg BUILD_COMMIT_SHA="${BUILD_COMMIT_SHA}" \
            --build-arg BUILD_TIME="${BUILD_TIME}" \
            --build-arg BUILD_IMAGE_TAG="${BUILD_IMAGE_TAG}" \
            --build-arg NEXT_PUBLIC_SITE_URL="${NEXT_PUBLIC_SITE_URL}" \
            --provenance=false \
            --output "type=oci,dest=${APP_RUNTIME_OCI_ARCHIVE}" \
            .

      - name: Build db-job candidate OCI artifact
        run: |
          set -euo pipefail
          docker buildx build \
            --file containers/app/Dockerfile \
            --target db-job \
            --platform linux/amd64 \
            --metadata-file tmp/container-pr-artifacts/oci/db-job-buildx.json \
            --tag "${DB_JOB_IMAGE}:${DB_JOB_TAG}" \
            --provenance=false \
            --output "type=oci,dest=${DB_JOB_OCI_ARCHIVE}" \
            .

      - name: Build demo seed candidate OCI artifact
        run: |
          set -euo pipefail
          docker buildx build \
            --file containers/app/Dockerfile \
            --target demo-seed \
            --platform linux/amd64 \
            --metadata-file tmp/container-pr-artifacts/oci/demo-seed-buildx.json \
            --tag "${DEMO_SEED_IMAGE}:${DEMO_SEED_TAG}" \
            --provenance=false \
            --output "type=oci,dest=${DEMO_SEED_OCI_ARCHIVE}" \
            .

      - name: Build HSA directory mock candidate OCI artifact
        run: |
          set -euo pipefail
          docker buildx build \
            --file containers/hsa-directory-mock/Dockerfile \
            --platform linux/amd64 \
            --metadata-file tmp/container-pr-artifacts/oci/hsa-directory-mock-buildx.json \
            --tag "${HSA_DIRECTORY_MOCK_IMAGE}:${HSA_DIRECTORY_MOCK_TAG}" \
            --provenance=false \
            --output "type=oci,dest=${HSA_DIRECTORY_MOCK_OCI_ARCHIVE}" \
            containers/hsa-directory-mock

      - name: Build HSA person lookup adapter candidate OCI artifact
        run: |
          set -euo pipefail
          docker buildx build \
            --file containers/hsa-person-lookup-adapter/Dockerfile \
            --platform linux/amd64 \
            --metadata-file tmp/container-pr-artifacts/oci/hsa-person-lookup-adapter-buildx.json \
            --tag "${HSA_PERSON_LOOKUP_ADAPTER_IMAGE}:${HSA_PERSON_LOOKUP_ADAPTER_TAG}" \
            --provenance=false \
            --output "type=oci,dest=${HSA_PERSON_LOOKUP_ADAPTER_OCI_ARCHIVE}" \
            containers/hsa-person-lookup-adapter

      - name: Gate PR images against release vulnerability policy
        uses: ./.github/actions/container-vulnerability-gate
        with:
          app-runtime: oci-archive:${{ env.APP_RUNTIME_OCI_ARCHIVE }}
          artifact-prefix: tmp/container-pr-artifacts/vulnerability
          db-job: oci-archive:${{ env.DB_JOB_OCI_ARCHIVE }}
          demo-seed: oci-archive:${{ env.DEMO_SEED_OCI_ARCHIVE }}
          hsa-directory-mock: oci-archive:${{ env.HSA_DIRECTORY_MOCK_OCI_ARCHIVE }}
          hsa-person-lookup-adapter: oci-archive:${{ env.HSA_PERSON_LOOKUP_ADAPTER_OCI_ARCHIVE }}

      - name: Create per-container local env files
        run: npm run container:env:local

      - name: Generate production-smoke TLS
        run: node scripts/containers/generate-tls.mjs --output-dir tmp/container-tls

      - name: Prepare exact PR stack lock
        run: |
          set -euo pipefail

          app_image_id="$(jq -er '."containerimage.config.digest"' tmp/container-pr-artifacts/oci/app-runtime-buildx.json)"
          app_manifest_digest="$(jq -er '."containerimage.digest"' tmp/container-pr-artifacts/oci/app-runtime-buildx.json)"
          db_job_image_id="$(jq -er '."containerimage.config.digest"' tmp/container-pr-artifacts/oci/db-job-buildx.json)"
          db_job_manifest_digest="$(jq -er '."containerimage.digest"' tmp/container-pr-artifacts/oci/db-job-buildx.json)"
          demo_seed_image_id="$(jq -er '."containerimage.config.digest"' tmp/container-pr-artifacts/oci/demo-seed-buildx.json)"
          hsa_directory_mock_image_id="$(jq -er '."containerimage.config.digest"' tmp/container-pr-artifacts/oci/hsa-directory-mock-buildx.json)"
          hsa_adapter_image_id="$(jq -er '."containerimage.config.digest"' tmp/container-pr-artifacts/oci/hsa-person-lookup-adapter-buildx.json)"
          node scripts/containers/generate-stack-lock.mjs generate \
            --app-image "${APP_RUNTIME_IMAGE}" \
            --app-tag "${APP_RUNTIME_TAG}" \
            --app-manifest-digest "${app_manifest_digest}" \
            --app-image-id "${app_image_id}" \
            --app-source pr-build \
            --db-job-image "${DB_JOB_IMAGE}" \
            --db-job-tag "${DB_JOB_TAG}" \
            --db-job-manifest-digest "${db_job_manifest_digest}" \
            --db-job-image-id "${db_job_image_id}" \
            --db-job-source pr-build
          node scripts/containers/generate-stack-lock.mjs check

          {
            echo "APP_RUNTIME_IMAGE_ID=${app_image_id}"
            echo "DB_JOB_IMAGE_ID=${db_job_image_id}"
            echo "DEMO_SEED_IMAGE_ID=${demo_seed_image_id}"
            echo "HSA_DIRECTORY_MOCK_IMAGE_ID=${hsa_directory_mock_image_id}"
            echo "HSA_PERSON_LOOKUP_ADAPTER_IMAGE_ID=${hsa_adapter_image_id}"
          } >> "${GITHUB_ENV}"

      - name: Prune BuildKit cache before production smoke
        run: |
          set -euo pipefail
          docker buildx prune --all --force
          "${RUNNER_TEMP}/report-disk-layout.sh" "before production smoke"

      - name: Build production deployment archive for PR
        run: |
          node scripts/containers/prepare-production-smoke-bundle.mjs \
            --version "${BUILD_VERSION}" \
            --commit-sha "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --app-ref "${APP_RUNTIME_IMAGE_REF}" \
            --app-image-id "${APP_RUNTIME_IMAGE_ID}" \
            --db-job-ref "${DB_JOB_IMAGE_REF}" \
            --db-job-image-id "${DB_JOB_IMAGE_ID}" \
            --stack-lock container-stack.lock.json \
            --output-dir tmp/container-pr-artifacts/deployment

      - name: Install production archive with rootless Quadlet
        run: |
          scripts/containers/production-smoke.sh up --archive \
            "tmp/container-pr-artifacts/kravhantering-production-deploy-${BUILD_VERSION}.tar.gz"

      - name: Report OCI verification disk layout
        run: |
          "${RUNNER_TEMP}/report-disk-layout.sh" "before OCI verification"

      - name: Verify OCI archives
        run: |
          set -euo pipefail
          trap 'bash "${RUNNER_TEMP}/report-disk-layout.sh" "after OCI verification" || true' EXIT
          npm run container:oci:verify -- \
            --output-dir tmp/container-pr-artifacts/oci \
            --verify-root "/tmp/kh-oci-${CONTAINER_STACK_RUN_ID}"

      - name: Verify production stack
        run: scripts/containers/production-smoke.sh verify

      - name: Collect production Quadlet evidence
        if: always()
        run: scripts/containers/production-smoke.sh evidence || true

      - name: Collect container runtime diagnostics
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/containers/ci-container-runtime.sh collect

      - name: Remove production Quadlet stack
        if: always()
        run: scripts/containers/production-smoke.sh down

      - name: Write artifact hashes
        if: always()
        run: |
          node scripts/containers/write-hashes.mjs \
            --output hashes.sha256 \
            container-stack.lock.json \
            public/build.json \
            tmp/container-pr-artifacts/kravhantering-production-deploy-${BUILD_VERSION}.tar.gz \
            "${APP_RUNTIME_OCI_ARCHIVE}" \
            "${DB_JOB_OCI_ARCHIVE}" \
            "${DEMO_SEED_OCI_ARCHIVE}" \
            "${HSA_DIRECTORY_MOCK_OCI_ARCHIVE}" \
            "${HSA_PERSON_LOOKUP_ADAPTER_OCI_ARCHIVE}" || true

      - name: Stage runtime artifacts
        if: always()
        run: |
          set -euo pipefail
          mkdir -p \
            tmp/container-pr-artifacts/runtime \
            tmp/container-pr-artifacts/playwright

          for file in \
            container-stack.lock.json \
            public/build.json \
            hashes.sha256; do
            if [ -f "${file}" ]; then
              cp "${file}" tmp/container-pr-artifacts/runtime/
            fi
          done

          if [ -d tmp/production-smoke-evidence ]; then
            cp -R \
              tmp/production-smoke-evidence \
              tmp/container-pr-artifacts/runtime/production-smoke-evidence
          fi
          if [ -d "${CI_RUNTIME_EVIDENCE_DIR}" ]; then
            cp -R \
              "${CI_RUNTIME_EVIDENCE_DIR}" \
              tmp/container-pr-artifacts/runtime/runtime-diagnostics
          fi

          if [ -d playwright-report-release-smoke ]; then
            cp -R \
              playwright-report-release-smoke \
              tmp/container-pr-artifacts/playwright/html
          fi
          if [ -d test-results/release-smoke ]; then
            cp -R \
              test-results/release-smoke \
              tmp/container-pr-artifacts/playwright/test-results
          fi

      - name: Upload runtime artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-pr-runtime-${{ github.run_id }}
          path: tmp/container-pr-artifacts/runtime/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-pr-playwright-${{ github.run_id }}
          path: tmp/container-pr-artifacts/playwright/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload vulnerability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-pr-vulnerability-${{ github.run_id }}
          path: tmp/container-pr-artifacts/vulnerability/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload OCI archives
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-pr-oci-${{ github.run_id }}
          path: tmp/container-pr-artifacts/oci/*.oci.tar
          if-no-files-found: ignore
          retention-days: 2

  runner-metadata:
    name: Capture Container Smoke Runner Metadata
    needs: container-smoke
    if: ${{ always() && needs.container-smoke.result != 'skipped' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/reusable-container-runner-metadata.yml
    with:
      artifact-name: container-pr-runner-metadata-${{ github.run_id }}
      evidence-directory: tmp/container-pr-runner-metadata
      retention-days: 7
      target-job: Build and Smoke Test Container Stack
