name: Dependency Drift

on:
  workflow_dispatch:
    inputs:
      unit:
        description: Maintenance unit to check
        required: false
        default: all
        type: choice
        options:
          - all
          - npm
          - lychee
          - devcontainer-base
          - node
          - nginx
          - sqlserver
          - keycloak
          - kong
  schedule:
    - cron: '17 5 * * 1'

concurrency:
  group: ${{ github.workflow }}-main
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  dependency-drift:
    name: Reconcile Dependency Drift Issues
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GH_TOKEN: ${{ github.token }}
      DEPENDENCY_DRIFT_UNIT: ${{ github.event.inputs.unit || 'all' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Reconcile dependency drift issues
        run: node .github/workflows/dependency-drift.mjs
