name: HSA mTLS topology

on:
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: hsa-mtls-topology-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  production_app:
    name: Production App authenticated topology
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/container-pr-smoke.yml

  build:
    name: Build current-commit OCI candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out current commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Prepare Docker Buildx builder
        run: |
          set -euo pipefail
          docker buildx create --name kravhantering-hsa-topology-builder --use ||
            docker buildx use kravhantering-hsa-topology-builder
          docker buildx inspect --bootstrap
      - name: Build shared OCI candidates
        run: |
          set -euo pipefail
          mkdir -p /tmp/hsa-oci
          docker buildx build --provenance=false \
            --tag localhost/kravhantering/hsa-transport-contract-test:topology \
            --output type=docker,dest=/tmp/hsa-oci/transport-test.tar \
            --file containers/hsa-mtls-topology/Dockerfile .
          docker buildx build --provenance=false \
            --tag localhost/kravhantering/hsa-mtls-provisioner:topology \
            --output type=docker,dest=/tmp/hsa-oci/provisioner.tar \
            --file containers/hsa-mtls-provisioner/Dockerfile .
          docker buildx build --provenance=false \
            --tag localhost/kravhantering/hsa-person-lookup-adapter:topology \
            --output type=docker,dest=/tmp/hsa-oci/adapter.tar \
            --file containers/hsa-person-lookup-adapter/Dockerfile .
          docker buildx build --provenance=false \
            --tag localhost/kravhantering/hsa-directory-mock:topology \
            --output type=docker,dest=/tmp/hsa-oci/mock.tar \
            --file containers/hsa-directory-mock/Dockerfile .
      - name: Upload exact OCI candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hsa-mtls-current-commit-oci
          path: /tmp/hsa-oci
          retention-days: 1

  topology:
    name: Authenticated topology and isolation
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out current commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Download exact OCI candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: hsa-mtls-current-commit-oci
          path: /tmp/hsa-oci
      - name: Load exact OCI candidates
        run: for archive in /tmp/hsa-oci/*.tar; do docker load --input "$archive"; done
      - name: Start loaded candidates and verify strict topology
        run: |
          set -euo pipefail
          compose=(docker compose -f containers/hsa-mtls-topology/compose.yml)
          "${compose[@]}" up --no-build provisioner
          "${compose[@]}" up --no-build -d --wait mock adapter kong
          "${compose[@]}" run --rm --no-deps test | tee /tmp/hsa-topology.log
      - name: Verify correlation continuity and exactly-once terminal handling
        run: |
          set -euo pipefail
          correlation="$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}' /tmp/hsa-topology.log | tail -1)"
          test -n "$correlation"
          docker compose -f containers/hsa-mtls-topology/compose.yml logs --no-color kong adapter mock > /tmp/hsa-runtime.log
          test "$(grep -Ec "hsa_app_lookup_started.*$correlation|$correlation.*hsa_app_lookup_started" /tmp/hsa-topology.log)" -eq 1
          test "$(grep -ac "kong.*$correlation" /tmp/hsa-runtime.log)" -eq 1
          test "$(grep -aEc "adapter.*(hsa_adapter_lookup_forwarded.*$correlation|$correlation.*hsa_adapter_lookup_forwarded)" /tmp/hsa-runtime.log)" -eq 1
          test "$(grep -aEc "mock.*(hsa_mock_lookup_handled.*$correlation|$correlation.*hsa_mock_lookup_handled)" /tmp/hsa-runtime.log)" -eq 1
          grep -a "mock.*$correlation" /tmp/hsa-runtime.log | grep '"handling_count":1'
      - name: Inspect runtime isolation
        run: |
          set -euo pipefail
          docker compose -f containers/hsa-mtls-topology/compose.yml config > /tmp/hsa-compose.txt
          if grep -E '(:rw|ca-signing|HSA_MOCK_AUTH_MODE|NODE_TLS_REJECT_UNAUTHORIZED)' /tmp/hsa-compose.txt; then
            exit 1
          fi
          containers/hsa-mtls-topology/runtime-inspection.sh
          docker compose -f containers/hsa-mtls-topology/compose.yml run --rm provisioner inspect
      - name: Reject foreign material in every runtime leaf role
        run: containers/hsa-mtls-topology/runtime-substitution-test.sh
      - name: Reject same-domain wrong servers through deployed clients
        run: containers/hsa-mtls-topology/runtime-wrong-server-test.sh
      - name: Remove ephemeral PKI material
        if: always()
        run: docker compose -f containers/hsa-mtls-topology/compose.yml down --volumes --remove-orphans

  rotation:
    name: Rotation and rollback (${{ matrix.trust-domain }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        trust-domain: [app-to-kong, kong-to-adapter, adapter-to-hsa]
    steps:
      - name: Check out current commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Download exact OCI candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: hsa-mtls-current-commit-oci
          path: /tmp/hsa-oci
      - name: Load exact OCI candidates
        run: for archive in /tmp/hsa-oci/*.tar; do docker load --input "$archive"; done
      - name: Start and verify current generation
        run: |
          set -euo pipefail
          compose=(docker compose -f containers/hsa-mtls-topology/compose.yml)
          "${compose[@]}" up --no-build provisioner
          "${compose[@]}" up --no-build -d --wait mock adapter kong
          "${compose[@]}" run --rm --no-deps test
      - name: Rotate, authenticate, and finalize successful generation
        env:
          HSA_MTLS_LIFETIME: ephemeral
        run: containers/hsa-mtls-topology/lifecycle.sh rotate '${{ matrix.trust-domain }}'
      - name: Inject failure, roll back, and authenticate prior generation
        env:
          HSA_MTLS_LIFETIME: ephemeral
        run: containers/hsa-mtls-topology/lifecycle.sh rollback-verification '${{ matrix.trust-domain }}'
      - name: Remove ephemeral PKI material
        if: always()
        run: docker compose -f containers/hsa-mtls-topology/compose.yml down --volumes --remove-orphans

  required:
    name: HSA mTLS topology required
    if: always()
    needs: [production_app, build, topology, rotation]
    runs-on: ubuntu-24.04
    steps:
      - name: Report stable required result
        env:
          ROTATION_RESULT: ${{ needs.rotation.result }}
          TOPOLOGY_RESULT: ${{ needs.topology.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PRODUCTION_APP_RESULT: ${{ needs.production_app.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$TOPOLOGY_RESULT" = success
          test "$ROTATION_RESULT" = success
          test "$PRODUCTION_APP_RESULT" = success
