name: Devcontainer Image Smoke

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  development-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Build observable development stage
        run: >-
          docker buildx build --file .devcontainer/Dockerfile --target development --tag localhost/kravhantering/devcontainer-tools:smoke --load .

      - name: Observe installed development tools
        run: |
          docker run --rm \
            localhost/kravhantering/devcontainer-tools:smoke \
            codex --version
          docker run --rm \
            localhost/kravhantering/devcontainer-tools:smoke \
            dotenv-linter --version
    needs:
      - select
    if: ${{ contains(fromJSON(needs.select.outputs.owners || '[]'), 'devcontainer') }}
    name: development-tools (execution)
  select:
    name: Select applicable validation
    uses: ./.github/workflows/reusable-validation-selection.yml
    permissions:
      contents: read
    with:
      workflow: devcontainer-image-smoke
  development-tools-result:
    name: development-tools
    if: ${{ always() }}
    needs:
      - select
      - development-tools
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout event source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Report selection and required result
        uses: ./.github/actions/report-validation
        with:
          selection-result: ${{ needs.select.result }}
          selection: ${{ needs.select.outputs.selection }}
          results: ${{ toJSON(needs) }}
          owner: devcontainer
          owner-jobs: '{"devcontainer":["development-tools"]}'
