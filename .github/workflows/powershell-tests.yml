name: PowerShell tests

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/powershell-tests.yml'
      - 'package.json'
      - 'scripts/azure-dev/**'
      - 'scripts/test-powershell-integration.mjs'
      - 'tests/powershell/Integration/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/powershell-tests.yml'
      - 'package.json'
      - 'scripts/azure-dev/**'
      - 'scripts/test-powershell-integration.mjs'
      - 'tests/powershell/Integration/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pester:
    name: Pester 6
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install repository npm
        run: node scripts/install-repository-npm.mjs

      - name: Run Pester integration tests
        run: npm run test:powershell:integration

      - name: Upload Pester results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pester-results
          path: test-results/pester/**
          if-no-files-found: error
          retention-days: 7
