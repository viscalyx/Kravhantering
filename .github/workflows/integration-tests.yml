name: Integration Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dev-server-smoke:
    name: Dev Server Smoke (Developer Mode)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install repository npm
        run: node scripts/install-repository-npm.mjs

      - name: Restore npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Clean server and database state
        run: npm run clean:all

      - name: Prepare SQL Server env file
        run: |
          cp .env.sqlserver.ci .env.sqlserver

      - name: Start local database service
        run: npm run db:up

      - name: Setup local SQL Server database
        run: npm run db:setup

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Start and wait for local IdP service
        run: npm run idp:up

      - name: Run Developer Mode smoke against dev server
        run: |
          set -euo pipefail
          start_epoch="$(date +%s)"
          set +e
          npm run test:integration -- \
            tests/integration/developer-mode/overlay.spec.ts \
            --grep "DEVTOOLS-01: shows chip on hover and copies a contextual reference"
          test_exit=$?
          set -e
          end_epoch="$(date +%s)"
          duration_seconds=$((end_epoch - start_epoch))
          hours=$((duration_seconds / 3600))
          minutes=$(((duration_seconds % 3600) / 60))
          seconds=$((duration_seconds % 60))
          formatted="$(printf '%02dh %02dm %02ds' "${hours}" "${minutes}" "${seconds}")"
          echo "Dev server smoke runtime: ${formatted} (${duration_seconds}s)"
          {
            echo "### Dev server smoke runtime"
            echo
            echo "- Runtime: ${formatted} (${duration_seconds}s)"
            echo "- Command: \`npm run test:integration -- tests/integration/developer-mode/overlay.spec.ts --grep \"DEVTOOLS-01: shows chip on hover and copies a contextual reference\"\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${test_exit}"
        env:
          CI: true

      - name: Upload test results (dev smoke)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-dev-smoke
          path: playwright-report-dev/
          retention-days: 7

      - name: Upload test results XML (dev smoke)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-junit-dev-smoke
          path: test-results/dev/playwright-junit.xml
          retention-days: 7

      - name: Stop local IdP service
        if: always()
        run: npm run idp:down

      - name: Stop local database service
        if: always()
        run: npm run db:down

  sql-integration:
    name: SQL Server Invariants
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install repository npm
        run: node scripts/install-repository-npm.mjs

      - name: Restore npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare SQL Server env file
        run: cp .env.sqlserver.ci .env.sqlserver

      - name: Start local database service
        run: npm run db:up

      - name: Wait for local database service
        run: |
          npm exec -- dotenv \
            -e .env.sqlserver \
            --override \
            -- node scripts/db-sqlserver-admin.mjs wait

      - name: Run focused SQL integration tests
        run: npm run test:sql-integration

      - name: Capture SQL Server diagnostics
        if: failure()
        run: |
          mkdir -p test-results/sql-integration
          diagnostics_path="test-results/sql-integration/sqlserver-diagnostics.log"
          {
            echo "Captured at $(date --iso-8601=seconds)"
            echo
            echo "## SQL Server client route"
            echo "Client context: GitHub Actions runner host"
            sed -n \
              -e '/^DB_HOST=/p' \
              -e '/^DB_PORT=/p' \
              -e '/^SQLSERVER_HOST_PORT=/p' \
              .env.sqlserver
            echo "Published container endpoint:"
            docker compose \
              --env-file .env.sqlserver \
              -f docker-compose.sqlserver.yml \
              port db 1433 || true

            echo
            echo "## Docker Compose service status"
            docker compose \
              --env-file .env.sqlserver \
              -f docker-compose.sqlserver.yml \
              ps --all || true

            container_id="$(
              docker compose \
                --env-file .env.sqlserver \
                -f docker-compose.sqlserver.yml \
                ps -q db 2>/dev/null || true
            )"
            echo
            echo "## SQL Server container state"
            if [ -n "${container_id}" ]; then
              docker inspect \
                --format '{{json .State}}' \
                "${container_id}" || true
            else
              echo "SQL Server container was not found."
            fi

            echo
            echo "## SQL Server container logs"
            docker compose \
              --env-file .env.sqlserver \
              -f docker-compose.sqlserver.yml \
              logs --timestamps --no-color db || true
          } 2>&1 | tee "${diagnostics_path}"

      - name: Upload SQL integration results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sql-integration-results
          path: test-results/sql-integration/
          retention-days: 7

      - name: Stop local database service
        if: always()
        run: npm run db:down

  test-prodlike-pruned:
    name: Pruned Runtime Contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install repository npm
        run: node scripts/install-repository-npm.mjs
      - name: Restore npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check integration chunk manifest
        run: npm run test:integration:chunks:check
      - name: Clean server and database state
        run: npm run clean:all
      - name: Prepare SQL Server env file
        run: cp .env.sqlserver.ci .env.sqlserver
      - name: Start local database service
        run: npm run db:up
      - name: Setup local SQL Server database
        run: npm run db:setup
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Start and wait for local IdP service
        run: npm run idp:up
      - name: Build prod-like bundle (full deps)
        run: npm run build:local-prod
        env:
          ENABLE_ERROR_BOUNDARY_TEST_ROUTE: "1"
      - name: Provision local AI provider-secret keyring
        run: node scripts/provision-ai-provider-secret-keyring.mjs
      - name: Start pruned prod-like server
        run: |
          mkdir -p test-results/prodlike-pruned
          server_log_path="test-results/prodlike-pruned/server.log"
          echo "Writing prod-like production server console log to ${server_log_path}"
          runtime_dir="$(mktemp -d /tmp/krav-pruned-XXXXXX)"
          echo "PRODLIKE_RUNTIME_DIR=${runtime_dir}" >> "$GITHUB_ENV"
          PRODLIKE_RUNTIME_DIR="${runtime_dir}" nohup npm run start:prodlike-pruned \
            > "${server_log_path}" 2>&1 &
          echo "$!" > test-results/prodlike-pruned/server.pid
        env:
          AI_CONNECTION_DATA_POLICIES_JSON: '{"generate_with_images":{"allowedProcessingRegions":["SE"],"informationClassOrder":["public","internal","confidential"],"maximumInformationClass":"internal","maximumRetentionDays":0,"personalDataAllowed":false,"requireTrainingProhibited":true},"generate_without_images":{"allowedProcessingRegions":["SE"],"informationClassOrder":["public","internal","confidential"],"maximumInformationClass":"internal","maximumRetentionDays":0,"personalDataAllowed":false,"requireTrainingProhibited":true},"repair_invalid_import_json":{"allowedProcessingRegions":["SE"],"informationClassOrder":["public","internal","confidential"],"maximumInformationClass":"internal","maximumRetentionDays":0,"personalDataAllowed":false,"requireTrainingProhibited":true}}'
          AI_CONNECTION_EGRESS_POLICIES_JSON: '{"controlled_test":{"allowedOrigins":[],"privateSidecarAddresses":["127.0.0.1","::1"],"privateSidecarOrigins":["https://localhost:4443"]}}'
          AI_CONNECTION_TLS_POLICIES_JSON: '{"controlled_test":"public_web_pki"}'
          ENABLE_ERROR_BOUNDARY_TEST_ROUTE: "1"
      - name: Wait for pruned server to respond
        run: |
          node --input-type=module - <<'NODE'
          import { waitForHttpReady } from './tests/integration-chunks.mjs'
          await waitForHttpReady('http://localhost:3001/api/auth/login', { expectedStatuses: [302, 303, 307, 308] })
          NODE
      - name: Run Playwright tests against pruned prod-like server
        run: |
          set -euo pipefail
          prodlike_server_log="test-results/prodlike-pruned/server.log"
          echo "Prod-like production server console log: ${prodlike_server_log}"
          echo "Server log artifact: prodlike-pruned-server-log"
          start_epoch="$(date +%s)"
          set +e
          npm run test:integration:prodlike
          test_exit=$?
          set -e
          end_epoch="$(date +%s)"
          duration_seconds=$((end_epoch - start_epoch))
          hours=$((duration_seconds / 3600))
          minutes=$(((duration_seconds % 3600) / 60))
          seconds=$((duration_seconds % 60))
          formatted="$(printf '%02dh %02dm %02ds' "${hours}" "${minutes}" "${seconds}")"
          echo "Integration tests (prodlike-pruned) runtime: ${formatted} (${duration_seconds}s)"
          {
            echo "### Integration test runtime (prodlike-pruned)"
            echo
            echo "- Runtime: ${formatted} (${duration_seconds}s)"
            echo "- Command: \`npm run test:integration:prodlike\`"
            echo "- Production server console log: \`${prodlike_server_log}\`"
            echo "- Server log artifact: \`prodlike-pruned-server-log\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${test_exit}"
        env:
          CI: true
          ENABLE_ERROR_BOUNDARY_TEST_ROUTE: "1"
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          PLAYWRIGHT_FORCE_AUTH_SETUP: "1"
          PLAYWRIGHT_BASE_URL: http://localhost:3001
      - name: Stop pruned prod-like server
        if: always()
        run: |
          if [ -f test-results/prodlike-pruned/server.pid ]; then
            kill "$(cat test-results/prodlike-pruned/server.pid)" || true
          fi
          npm run kill:port -- --port 3001 || true
          if [[ -n "${PRODLIKE_RUNTIME_DIR:-}" ]]; then rm -rf -- "${PRODLIKE_RUNTIME_DIR}"; fi
      - name: Capture owned service diagnostics
        if: always()
        run: |
          mkdir -p test-results/services
          docker compose --env-file .env.sqlserver -f docker-compose.sqlserver.yml logs --no-color > test-results/services/sqlserver.log 2>&1 || true
          docker compose -f docker-compose.idp.yml logs --no-color > test-results/services/keycloak.log 2>&1 || true
      - name: Upload pruned server log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prodlike-pruned-server-log
          path: |
            test-results/prodlike-pruned/server.log
            test-results/server-logs/prodlike/**
            test-results/hsa-person-lookup/prodlike-pruned.log
          retention-days: 7
      - name: Upload test results (prodlike-pruned)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-prodlike-pruned
          path: |
            playwright-report-prodlike/
            test-results/prodlike/
            test-results/prodlike-pruned/
            test-results/server-logs/prodlike/
            test-results/services/
          retention-days: 7
      - name: Upload test results XML (prodlike-pruned)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-junit-prodlike-pruned
          path: test-results/prodlike/playwright-junit.xml
          retention-days: 7
      - name: Stop local IdP service
        if: always()
        run: npm run idp:down
      - name: Stop local database service
        if: always()
        run: npm run db:down
  browser-functional:
    name: Browser Functional Integration
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install repository npm
        run: node scripts/install-repository-npm.mjs
      - name: Restore npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check integration chunk manifest
        run: npm run test:integration:chunks:check
      - name: Provision local AI provider-secret keyring
        run: node scripts/provision-ai-provider-secret-keyring.mjs
      - name: Clean server and database state
        run: npm run clean:all
      - name: Prepare SQL Server env file
        run: cp .env.sqlserver.ci .env.sqlserver
      - name: Start local database service
        run: npm run db:up
      - name: Setup local SQL Server database
        run: npm run db:setup
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Start and wait for local IdP service
        run: npm run idp:up
      - name: Run browser-functional chunks
        run: |
          start_epoch="$(date +%s)"
          set +e
          npm run test:integration
          test_exit=$?
          set -e
          echo "Browser functional runtime: $(($(date +%s) - start_epoch))s; result: ${test_exit}" >> "$GITHUB_STEP_SUMMARY"
          exit "$test_exit"
        env:
          CI: true
      - name: Capture owned service diagnostics
        if: always()
        run: |
          mkdir -p test-results/services
          docker compose --env-file .env.sqlserver -f docker-compose.sqlserver.yml logs --no-color > test-results/services/sqlserver.log 2>&1 || true
          docker compose -f docker-compose.idp.yml logs --no-color > test-results/services/keycloak.log 2>&1 || true
      - name: Upload browser-functional evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-functional-evidence
          path: |
            playwright-report-dev/
            test-results/dev/
            test-results/server-logs/dev/
            test-results/services/
          retention-days: 7
      - name: Stop local IdP service
        if: always()
        run: npm run idp:down
      - name: Stop local database service
        if: always()
        run: npm run db:down
