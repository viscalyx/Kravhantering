name: Weekly Integration Chunk Isolation

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Read dev chunk manifest
    if: >-
      github.event_name != 'schedule' ||
      github.repository == 'viscalyx/Kravhantering'
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.chunks.outputs.chunks }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Read dev chunks
        id: chunks
        run: |
          chunks="$(
            node -e "
              const manifest = require('./tests/integration-chunks.manifest.json')
              const ids = manifest.suites.dev.chunks.map(chunk => chunk.id)
              process.stdout.write(JSON.stringify(ids))
            "
          )"
          echo "chunks=${chunks}" >> "${GITHUB_OUTPUT}"

  isolated-chunk:
    name: Clean seed / ${{ matrix.chunk }}
    if: >-
      github.event_name != 'schedule' ||
      github.repository == 'viscalyx/Kravhantering'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.chunks) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install repository npm
        run: node scripts/install-repository-npm.mjs

      - name: Restore npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check integration chunk manifest
        run: npm run test:integration:chunks:check

      - name: Provision local AI provider-secret keyring
        run: node scripts/provision-ai-provider-secret-keyring.mjs

      - name: Clean server state
        run: npm run clean:all

      - name: Prepare SQL Server env file
        run: cp .env.sqlserver.ci .env.sqlserver

      - name: Start local database service
        run: npm run db:up

      - name: Create clean demo seed
        run: npm run db:setup

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start and wait for local IdP service
        run: npm run idp:up

      - name: Run isolated dev chunk
        run: >
          npm run test:integration --
          --chunk "${{ matrix.chunk }}"
        env:
          CI: true

      - name: Stop local IdP service
        if: always()
        run: npm run idp:down

      - name: Stop local database service
        if: always()
        run: npm run db:down

      - name: Upload isolated chunk results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-isolation-${{ matrix.chunk }}
          path: |
            playwright-report-dev/
            test-results/dev/
            test-results/server-logs/dev/
            test-results/hsa-person-lookup/weekly-isolation.log
          retention-days: 7
