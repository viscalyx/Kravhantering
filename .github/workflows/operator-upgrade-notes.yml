name: Operator Upgrade Notes

on:
  pull_request_target:
    branches: [main]
    types: [closed]

concurrency:
  group: ${{ github.workflow }}-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  persist-operator-upgrade-notes:
    if: >-
      github.event.pull_request.merged == true &&
      (
        github.event.pull_request.user.login != 'dependabot[bot]' ||
        !startsWith(github.event.pull_request.title, 'build(deps):')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Validate operator upgrade notes token
        env:
          GH_TOKEN: ${{ secrets.OPERATOR_UPGRADE_NOTES_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::OPERATOR_UPGRADE_NOTES_TOKEN is required."
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}" --jq '.full_name' >/dev/null

      - name: Prepare operator notes branch
        env:
          GH_TOKEN: ${{ secrets.OPERATOR_UPGRADE_NOTES_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NOTES_BRANCH: automation/operator-upgrade-notes
        run: |
          set -euo pipefail
          git config user.name "Viscalyxbot"
          git config user.email "viscalyxbot@viscalyx.se"

          if git ls-remote --exit-code --heads origin "${NOTES_BRANCH}" >/dev/null; then
            git fetch origin "${NOTES_BRANCH}:refs/remotes/origin/${NOTES_BRANCH}"
          fi

          open_notes_pr="$(
            gh pr list --repo "${GITHUB_REPOSITORY}" \
              --base main \
              --head "${NOTES_BRANCH}" \
              --state open \
              --json number,isCrossRepository \
              --jq '[.[] | select(.isCrossRepository == false)][0].number // empty'
          )"
          if [ -n "${open_notes_pr}" ]; then
            if ! git show-ref --verify --quiet \
              "refs/remotes/origin/${NOTES_BRANCH}"; then
              echo "::error::Operator upgrade notes PR exists without a target-repository branch."
              exit 1
            fi
            git switch --create "${NOTES_BRANCH}" "origin/${NOTES_BRANCH}"
            git rebase origin/main
          else
            git switch --create "${NOTES_BRANCH}" origin/main
          fi

      - name: Sync operator upgrade notes
        run: node scripts/release/operator-upgrade-notes.mjs sync-pr --github-pr "${PR_NUMBER}"
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.OPERATOR_UPGRADE_NOTES_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Open operator upgrade notes pull request
        env:
          GH_TOKEN: ${{ secrets.OPERATOR_UPGRADE_NOTES_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NOTES_BRANCH: automation/operator-upgrade-notes
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if git diff --quiet -- "docs/operations/operator-upgrade-notes.md" &&
            git diff --quiet origin/main...HEAD -- "docs/operations/operator-upgrade-notes.md"; then
            echo "No operator upgrade notes changes to commit."
            exit 0
          fi

          if ! git diff --quiet -- "docs/operations/operator-upgrade-notes.md"; then
            git add "docs/operations/operator-upgrade-notes.md"
            git commit -m "docs: persist operator upgrade notes from #${PR_NUMBER}"
          fi

          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git show-ref --verify --quiet "refs/remotes/origin/${NOTES_BRANCH}"; then
            git push --force-with-lease origin HEAD:"refs/heads/${NOTES_BRANCH}"
          else
            git push origin HEAD:"refs/heads/${NOTES_BRANCH}"
          fi

          title="docs: persist operator upgrade notes from #${PR_NUMBER}"
          render_pr_body() {
            sed \
              -e "s|__PR_NUMBER__|${PR_NUMBER}|g" \
              -e "s|__RUN_URL__|${RUN_URL}|g" <<'PR_BODY'
          This automated PR persists merged Operator Upgrade Impact notes under `## Unreleased`.

          - Latest source PR: #__PR_NUMBER__
          - Workflow run: __RUN_URL__

          The maintainer approves these notes by merging the source PR.
          The workflow requests auto-merge, subject to required checks and branch protection requirements. If the request fails, this PR remains available for manual merging.

          ## Operator Upgrade Impact

          - [x] No operator notes needed. <!-- DO NOT REMOVE: operator-upgrade:no-notes -->

          ## SSDLC (Secure Software Development Life Cycle) Gate

          - [x] I have reviewed SSDLC requirements for this change and addressed any security, data protection, threat-model, and security-testing impacts. <!-- DO NOT REMOVE: ssdlc:requirements -->
          PR_BODY
          }

          pr_number="$(
            gh pr list --repo "${GITHUB_REPOSITORY}" \
              --base main \
              --head "${NOTES_BRANCH}" \
              --state open \
              --json number,isCrossRepository \
              --jq '[.[] | select(.isCrossRepository == false)][0].number // empty'
          )"
          if [ -z "${pr_number}" ]; then
            render_pr_body | \
              gh pr create --repo "${GITHUB_REPOSITORY}" \
                --base main \
                --head "${GITHUB_REPOSITORY%%/*}:${NOTES_BRANCH}" \
                --title "${title}" \
                --body-file -
            pr_number="$(
              gh pr list --repo "${GITHUB_REPOSITORY}" \
                --base main \
                --head "${NOTES_BRANCH}" \
                --state open \
                --json number,isCrossRepository \
                --jq '[.[] | select(.isCrossRepository == false)][0].number // empty'
            )"
          else
            render_pr_body | \
              gh pr edit "${pr_number}" \
                --repo "${GITHUB_REPOSITORY}" \
                --title "${title}" \
                --body-file -
          fi

          if [ -z "${pr_number}" ]; then
            echo "::error::Unable to find or create the operator upgrade notes pull request."
            exit 1
          fi

          expected_body="$(render_pr_body)"
          stored_body="$(
            gh pr view "${pr_number}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json body \
              --jq '.body'
          )"
          if [ "${stored_body}" != "${expected_body}" ]; then
            echo "::error::Operator upgrade notes PR body verification failed."
            exit 1
          fi

          if gh pr merge "${pr_number}" \
            --repo "${GITHUB_REPOSITORY}" \
            --squash --auto --delete-branch \
            --match-head-commit "$(git rev-parse HEAD)"; then
            echo "Auto-merge requested for operator upgrade notes PR #${pr_number}."
          else
            echo "::warning::Could not enable auto-merge for operator upgrade notes PR #${pr_number}. Check repository auto-merge settings and token permissions, then retry or merge after required checks pass."
          fi
