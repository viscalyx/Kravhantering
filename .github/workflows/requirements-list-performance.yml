name: Requirement List Performance

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  requirements-list-performance:
    name: Requirement List SQL Server Baseline (execution)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install repository npm
        run: node scripts/install-repository-npm.mjs

      - name: Restore npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Clean server and database state
        run: npm run clean:all

      - name: Prepare SQL Server env file
        run: cp .env.sqlserver.ci .env.sqlserver

      - name: Start local database service
        run: npm run db:up

      - name: Setup local SQL Server database
        run: npm run db:setup

      - name: Run requirement list performance baseline
        run: npm run perf:requirements-list

      - name: Run specification item pagination baseline
        run: npm run perf:specification-items

      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: requirements-list-performance
          path: test-results/requirements-list-performance/
          retention-days: 7

      - name: Upload specification pagination artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: specification-item-pagination-performance
          path: test-results/specification-item-pagination-performance/
          retention-days: 7

      - name: Stop local database service
        if: always()
        run: npm run db:down
    needs:
      - select
    if: ${{ contains(fromJSON(needs.select.outputs.owners || '[]'), 'performance') }}
  select:
    name: Select applicable validation
    uses: ./.github/workflows/reusable-validation-selection.yml
    permissions:
      contents: read
    with:
      workflow: requirements-list-performance
  requirements-list-performance-result:
    name: Requirement List SQL Server Baseline
    if: ${{ always() }}
    needs:
      - select
      - requirements-list-performance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout event source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Report selection and required result
        uses: ./.github/actions/report-validation
        with:
          selection-result: ${{ needs.select.result }}
          selection: ${{ needs.select.outputs.selection }}
          results: ${{ toJSON(needs) }}
          owner: performance
          owner-jobs: '{"performance":["requirements-list-performance"]}'
