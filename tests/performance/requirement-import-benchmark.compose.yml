name: kravhantering-requirement-import-benchmark

services:
  db:
    image: mcr.microsoft.com/mssql/server:2025-CU8-ubuntu-24.04
    cpus: 2
    mem_limit: 4g
    memswap_limit: 4g
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env.sqlserver}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 5s
      retries: 30
      start_period: 10s
      timeout: 5s
    ports:
      - "${REQUIREMENT_IMPORT_BENCHMARK_SQL_PORT:-14339}:1433"
    volumes:
      - benchmark-sqlserver-data:/var/opt/mssql

volumes:
  benchmark-sqlserver-data:
